<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- Generic dilution-refrigerator "chandelier" (line art, not a vendor image) -->
  <rect x="0" y="0" width="200" height="250" fill="#ffffff"/>
  <g stroke="#222222" stroke-width="2" fill="#ffffff">
    <!-- rods between plates -->
    <g stroke-width="2.5">
      <line x1="30" y1="18" x2="35" y2="64"/><line x1="170" y1="18" x2="165" y2="64"/>
      <line x1="38" y1="72" x2="43" y2="112"/><line x1="162" y1="72" x2="157" y2="112"/>
      <line x1="47" y1="120" x2="52" y2="152"/><line x1="153" y1="120" x2="148" y2="152"/>
      <line x1="56" y1="160" x2="62" y2="186"/><line x1="144" y1="160" x2="138" y2="186"/>
