      <rect x="25" y="62" width="150" height="12" rx="2"/>
      <rect x="35" y="110" width="130" height="12" rx="2"/>
      <rect x="45" y="150" width="110" height="12" rx="2"/>
      <rect x="55" y="184" width="90" height="12" rx="2"/>
    </g>
    <g stroke-width="1">
      <path d="M25 8v12M35 8v12M45 8v12M55 8v12M65 8v12M75 8v12M85 8v12M95 8v12M105 8v12M115 8v12M125 8v12M135 8v12M145 8v12M155 8v12M165 8v12M175 8v12"/>
      <path d="M35 62v12M45 62v12M55 62v12M65 62v12M75 62v12M85 62v12M95 62v12M105 62v12M115 62v12M125 62v12M135 62v12M145 62v12M155 62v12M165 62v12"/>
      <path d="M45 110v12M55 110v12M65 110v12M75 110v12M85 110v12M95 110v12M105 110v12M115 110v12M125 110v12M135 110v12M145 110v12M155 110v12"/>
