    <path d="M72 203h56M72 210h56" stroke-width="1"/>
    <path d="M78 218v14a6 6 0 0 0 12 0v-14M94 218v14a6 6 0 0 0 12 0v-14M110 218v14a6 6 0 0 0 12 0v-14" fill="none"/>
